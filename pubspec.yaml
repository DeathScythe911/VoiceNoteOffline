name: voice_note_offline
description: Optional free-tier online or private offline WhatsApp voice-note transcription for Android and iOS.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  whisper_ggml: 2.8.1
  receive_sharing_intent: 1.8.1
  file_picker: 10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: 11.1.0
  http: ^1.6.0
  http_parser: ^4.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/
