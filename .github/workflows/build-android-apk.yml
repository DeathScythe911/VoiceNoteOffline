
name: Repair project and build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Get uploaded files
        uses: actions/checkout@v4

      - name: Restore correct folder structure from mobile upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib assets/models templates/android templates/ios-share-extension tools tests

          for item in \
            'main.dart:lib/main.dart' \
            'README.txt:assets/models/README.txt' \
            'AndroidManifest.xml:templates/android/AndroidManifest.xml' \
            'Info.plist:templates/ios-share-extension/Info.plist' \
            'ShareViewController.swift:templates/ios-share-extension/ShareViewController.swift' \
            'configure_project.py:tools/configure_project.py' \
            'build_android.ps1:tools/build_android.ps1' \
            'build_android.sh:tools/build_android.sh' \
            'setup_mac.sh:tools/setup_mac.sh' \
            'setup_windows.ps1:tools/setup_windows.ps1' \
            'test_project_configuration.py:tests/test_project_configuration.py'; do

            source="${item%%:*}"
            destination="${item#*:}"

            if [[ -f "$source" && ! -e "$destination" ]]; then
              git mv "$source" "$destination"
              echo "Restored: $destination"
            fi
          done

          git add -A

          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Repair folder structure for Flutter project'

            git push || echo 'WARNING: Could not save repair to GitHub. Building from repaired working copy.'
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Generate and configure Android native project
        shell: bash
        run: |
          flutter config --no-analytics
          flutter create --no-pub --platforms=android --org com.offlinevoice --project-name voice_note_offline .
          python3 tools/configure_project.py
          python3 -m unittest discover -s tests -v

      - name: Bundle the free offline Whisper base model
        shell: bash
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            -o assets/models/ggml-base.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true'

          python3 - <<'PY'
          from pathlib import Path

          model = Path('assets/models/ggml-base.bin')

          if model.stat().st_size < 100_000_000:
              raise SystemExit('Model download incomplete')

          print(f'Offline model size: {model.stat().st_size / 1e6:.1f} MB')
          PY

      - name: Accept Android licenses and install Whisper NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;29.0.13113456"

          python3 - <<'PYTHON'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace(
              'ndkVersion = flutter.ndkVersion',
              'ndkVersion = "29.0.13113456"'
          )
          gradle.write_text(text, encoding='utf-8')
          PYTHON

      - name: Install packages and align sharing plugin Java target
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

          python3 - <<'PYTHON'
          from pathlib import Path

          plugin = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev' / 'receive_sharing_intent-1.8.1' / 'android' / 'build.gradle'

          if not plugin.is_file():
              raise SystemExit(f'Sharing plugin Android configuration not found: {plugin}')

          data = plugin.read_text(encoding='utf-8')

          if 'compileOptions {' not in data:
              needle = 'android {'

              if needle not in data:
                  raise SystemExit('Unexpected receive_sharing_intent Gradle layout')

              data = data.replace(
                  needle,
                  '''android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }''',
                  1
              )

              plugin.write_text(data, encoding='utf-8')

          print('Sharing plugin Java target set to 17 to match Kotlin 17')
          PYTHON

      - name: Compile installable Android APK
        shell: bash
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNoteOffline-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
